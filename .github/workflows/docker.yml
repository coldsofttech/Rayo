name: Docker

# Builds the command line image (Dockerfile) and checks it runs as an unprivileged user.
#
#   pull requests and main   build for linux/amd64 and run the smoke checks; nothing is published
#   release published        build for linux/amd64 and linux/arm64, and push to GHCR
#
# Pushing is off until you set the repository variable PUBLISH_GHCR=true (Settings > Secrets and
# variables > Actions > Variables). The image is ghcr.io/<owner>/<repository>, lowercase. See
# docs/docker.md.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/rayohx/**
      - src/rayohx_cli/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/rayohx/**
      - src/rayohx_cli/**
      - .github/workflows/docker.yml
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rayohx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check it runs, as a normal user, with its folders in place
        run: |
          set -euxo pipefail
          docker run --rm rayohx:test --version
          docker run --rm rayohx:test download --help > /dev/null
          test "$(docker run --rm --entrypoint id rayohx:test -u)" != 0
          docker run --rm --entrypoint sh rayohx:test -c 'touch /output/x /workspace/x'
          test "$(docker run --rm --entrypoint printenv rayohx:test RAYOHX_WORKSPACE)" = /workspace
          # A failure is reported with exit code 1 and a message on stderr, not a traceback.
          set +e
          docker run --rm rayohx:test info http://127.0.0.1:1/none.m3u8 --retries 0 2> err.txt
          code=$?
          set -e
          test "$code" = 1
          grep -q '^Error:' err.txt
          ! grep -q Traceback err.txt
      - name: Image size
        run: docker image ls rayohx:test --format '{{.Size}}'

  publish:
    name: publish (GHCR)
    if: ${{ github.event_name == 'release' && vars.PUBLISH_GHCR == 'true' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="${IMAGE,,}"
          version="${TAG#v}"
          tags="$image:$version"
          if [ "$PRERELEASE" != "true" ]; then tags="$tags,$image:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
